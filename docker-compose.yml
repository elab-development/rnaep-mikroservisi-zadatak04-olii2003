version: "3.9"

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Inventory Service ───────────────────────────────────────────────────────
  inventory:
    build: ./inventory
    container_name: inventory
    ports:
      - "8000:8000"
    env_file: ./inventory/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  inventory-consumer:
    build: ./inventory
    container_name: inventory-consumer
    command: python consumer.py
    env_file: ./inventory/.env
    depends_on:
      redis:
        condition: service_healthy
      inventory:
        condition: service_started
    restart: on-failure

  # ── Payment Service ─────────────────────────────────────────────────────────
  payment:
    build: ./payment
    container_name: payment
    ports:
      - "8001:8001"
    env_file: ./payment/.env
    depends_on:
      redis:
        condition: service_healthy
      inventory:
        condition: service_started
    restart: on-failure

  payment-consumer:
    build: ./payment
    container_name: payment-consumer
    command: python consumer.py
    env_file: ./payment/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  # ── Notification Service ────────────────────────────────────────────────────
  notification:
    build: ./notification
    container_name: notification
    env_file: ./notification/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
